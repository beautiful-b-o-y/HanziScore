<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HanziScore 字谱</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/api.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/capture.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/replay.js') }}" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">HanziScore / 字谱</p>
          <h1>书写记录台</h1>
        </div>
        <span class="status-pill" id="app-status">Checking</span>
      </header>

      <section class="workspace" aria-label="书写记录工作区">
        <div class="writing-area">
          <div class="field-row">
            <label for="target-character">目标字</label>
            <input id="target-character" name="target-character" maxlength="4" placeholder="永">
          </div>

          <div class="canvas-frame">
            <canvas id="writing-canvas" aria-label="书写画布"></canvas>
          </div>

          <div class="toolbar" aria-label="书写工具栏">
            <button type="button" id="clear-canvas" disabled>清空</button>
            <button type="button" id="save-capture" disabled>保存</button>
          </div>
        </div>

        <aside class="side-panel" aria-label="当前状态">
          <h2>阶段 6</h2>
          <dl class="capture-metrics">
            <div>
              <dt>笔画</dt>
              <dd id="stroke-count">0</dd>
            </div>
            <div>
              <dt>点数</dt>
              <dd id="point-count">0</dd>
            </div>
            <div>
              <dt>输入</dt>
              <dd id="pointer-types">未开始</dd>
            </div>
            <div>
              <dt>时长</dt>
              <dd id="duration-value">--</dd>
            </div>
            <div>
              <dt>轨迹</dt>
              <dd id="path-length-value">--</dd>
            </div>
            <div>
              <dt>速度</dt>
              <dd id="speed-value">--</dd>
            </div>
            <div>
              <dt>停顿</dt>
              <dd id="pause-count-value">--</dd>
            </div>
            <div>
              <dt>记录</dt>
              <dd id="record-id-value">--</dd>
            </div>
          </dl>
          <p class="capture-status" id="capture-status">Ready</p>
        </aside>
      </section>

      <section class="replay-workspace" aria-label="书写回放工作区">
        <div class="replay-area">
          <div class="field-row replay-selector-row">
            <label for="record-select">记录</label>
            <select id="record-select" disabled>
              <option value="">暂无记录</option>
            </select>
          </div>

          <div class="canvas-frame">
            <canvas id="replay-canvas" aria-label="回放画布"></canvas>
          </div>

          <div class="toolbar replay-toolbar" aria-label="回放工具栏">
            <button type="button" id="replay-play" disabled>播放</button>
            <button type="button" id="replay-pause" disabled>暂停</button>
            <button type="button" id="replay-reset" disabled>重置</button>
            <label class="speed-control" for="replay-speed">
              速度
              <input id="replay-speed" type="range" min="0.25" max="4" step="0.25" value="1" disabled>
              <span id="replay-speed-value">1x</span>
            </label>
          </div>
        </div>

        <aside class="side-panel replay-panel" aria-label="回放指标">
          <h2>回放</h2>
          <dl class="capture-metrics">
            <div>
              <dt>记录</dt>
              <dd id="replay-record-id">--</dd>
            </div>
            <div>
              <dt>目标字</dt>
              <dd id="replay-target">--</dd>
            </div>
            <div>
              <dt>笔画</dt>
              <dd id="replay-strokes">--</dd>
            </div>
            <div>
              <dt>点数</dt>
              <dd id="replay-points">--</dd>
            </div>
            <div>
              <dt>时长</dt>
              <dd id="replay-duration">--</dd>
            </div>
            <div>
              <dt>轨迹</dt>
              <dd id="replay-path">--</dd>
            </div>
            <div>
              <dt>均速</dt>
              <dd id="replay-speed-metric">--</dd>
            </div>
            <div>
              <dt>停顿</dt>
              <dd id="replay-pauses">--</dd>
            </div>
          </dl>
          <div class="explanation-panel" aria-label="书写解释">
            <div class="explanation-header">
              <h3>书写解释</h3>
              <span class="source-pill" id="explanation-source">--</span>
            </div>
            <button type="button" id="explanation-load" disabled>生成解释</button>
            <p class="explanation-text" id="explanation-text">选择一条记录后可生成解释。</p>
          </div>
          <p class="capture-status" id="replay-status">Ready</p>
        </aside>
      </section>

      <section class="event-workspace" aria-label="Stroke event details">
        <div class="event-header">
          <h2>Stroke Events</h2>
          <p id="event-summary">Select a saved record to view stroke-level events.</p>
        </div>
        <div class="stroke-detail-grid" id="stroke-detail-grid"></div>
        <div class="event-table-wrap">
          <table class="event-table">
            <thead>
              <tr>
                <th>Stroke</th>
                <th>Event</th>
                <th>Value</th>
                <th>Threshold</th>
              </tr>
            </thead>
            <tbody id="data-event-table">
              <tr>
                <td colspan="4">No record loaded.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </body>
</html>
